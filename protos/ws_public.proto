syntax = "proto3";

import "ws_common.proto";

package com.web3tech.cex.ws.proto;

option java_package = "com.web3tech.cex.ws.proto.wspublic";
option java_multiple_files = true;

message PublicWsClientMessage {
  oneof payload {
    SubscribeMessage subscribe = 1;
    UnsubscribeMessage unsubscribe = 2;
    PongMessage pong = 3;
  }
  string trace_id = 4;
}

message OrderbookSnapshotProto {
  string event = 1;
  string market_id = 2;
  repeated PriceLevelProto bids = 3;
  repeated PriceLevelProto asks = 4;
  int64 market_seq = 5;
  int32 depth = 6;
  int64 seq_num = 7;
  int64 timestamp_ms = 8;
  string trace_id = 9;
  int64 matcher_seq = 10;
}

message OrderbookDeltaProto {
  string event = 1;
  string market_id = 2;
  string side = 3;
  string price = 4;
  string size = 5;
  int64 market_seq = 6;
  string trace_id = 7;
  int64 matcher_seq = 8;
}

message TradeProto {
  string event = 1;
  string market_id = 2;
  string trade_id = 3;
  string price = 4;
  string quantity = 5;
  string side = 6;
  string timestamp = 7;
  string trace_id = 8;
}

message TickerProto {
  string event = 1;
  string market_id = 2;
  optional string last_price = 3;
  optional string best_bid = 4;
  optional string best_ask = 5;
  string volume_24h = 6;
  optional string high_24h = 7;
  optional string low_24h = 8;
  optional string change_24h = 9;
  string timestamp = 10;
  optional string best_bid_size = 11;
  optional string best_ask_size = 12;
  optional string prev_price_24h = 13;
  optional string turnover_24h = 14;
  string trace_id = 15;
}

message AggregatePriceProto {
  string event = 1;
  string market_id = 2;
  string aggregate_price = 3;
  string change_24h = 4;
  string timestamp = 5;
  string trace_id = 6;
}

message CandleProto {
  string event = 1;
  string market_id = 2;
  string timeframe = 3;
  string open_time = 4;
  string close_time = 5;
  string open = 6;
  string high = 7;
  string low = 8;
  string close = 9;
  string volume = 10;
  int64 trades = 11;
  bool closed = 12;
  string quote_volume = 13;
  string trace_id = 14;
}

message OrderbookDeltaBatchProto {
  string event = 1;
  string market_id = 2;
  repeated PriceLevelProto bids = 3;
  repeated PriceLevelProto asks = 4;
  int64 market_seq = 5;
  int64 seq_num = 6;
  int64 timestamp_ms = 7;
  string trace_id = 8;
  int64 matcher_seq = 9;
}

message TradeBatchProto {
  string event = 1;
  string market_id = 2;
  repeated TradeProto trades = 3;
  string trace_id = 4;
}

message MarkPriceProto {
  string event = 1;
  string market_id = 2;
  string mark_price = 3;
  int64 timestamp = 4;
}
